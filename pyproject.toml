[project]
name = "myjarvis"
version = "1.0.0"
description = "Personal Jarvis daemon — ALFRED personality, Windows-native, always-on"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "herog", email = "herog@example.com"}]
keywords = ["ai", "assistant", "jarvis", "daemon", "windows", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openjarvis @ git+https://github.com/open-jarvis/OpenJarvis.git",
    "pywin32>=306",
    "pystray>=0.19.4",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
myjarvis = "myjarvis.cli:main"
myjarvis-daemon = "myjarvis.daemon:run"
myjarvis-tray = "myjarvis.tray:run"
myjarvis-setup = "myjarvis.setup:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "PT", "PTH", "RUF", "SIM", "T20", "ARG", "COM", "LOG", "NPY", "PIE", "T10", "TCH", "B", "A", "C90", "DTZ", "EXE", "ISC", "ICN", "PD", "PGH", "PL", "PT", "Q", "RET", "S", "SLF", "SLOT", "T20", "TRIO", "TRY", "TID", "UNN", "ERA", "PD011", "PD012", "PD013", "PD014", "PD015", "PGH0", "PYI", "RSE", "RUF", "SIM", "T20", "TRY003", "UP007", "UP035", "PT001", "PT002", "PT003", "PT004", "PT005", "PT006", "PT007", "PT008", "PT009", "PT010", "PT011", "PT012", "PT013", "PT014", "PT015", "PT016", "PT017", "PT018", "PT019", "PT020", "PT021", "PT022", "PT023", "PT024", "PT025", "PT026", "PT027", "PT028", "PT029", "PT030", "PT031", "PT032", "PT033", "PT034", "PT035", "PT036", "PT037", "PT038", "PT039", "PT040", "PT041", "PT042", "PT043", "PT044", "PT045", "PT046", "PT047", "PT048", "PT049", "PT050", "PT051", "PT052", "PT053", "PT054", "PT055", "PT056", "PT057", "PT058", "PT059", "PT060", "PT061", "PT062", "PT063", "PT064", "PT065", "PT066", "PT067", "PT068", "PT069", "PT070", "PT071", "PT072", "PT073", "PT074", "PT075", "PT076", "PT077", "PT078", "PT079", "PT080", "PT081", "PT082", "PT083", "PT084", "PT085", "PT086", "PT087", "PT088", "PT089", "PT090", "PT091", "PT092", "PT093", "PT094", "PT095", "PT096", "PT097", "PT098", "PT099", "PT100"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true